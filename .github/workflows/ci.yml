name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Integration Tests
        working-directory: backend
        run: |
          echo "========================================"
          echo " Building Backend & Running Tests"
          echo "========================================"

          mvn -B -ntp clean verify


  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --loglevel=warn

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build


  docker-build:
    name: Docker Build Sanity
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Backend Docker Build
        run: |
          echo "Building Backend Docker image..."
          docker build -t hrms-backend:ci backend/

      - name: Verify Frontend Docker Build
        run: |
          echo "Building Frontend Docker image..."
          docker build -t hrms-frontend:ci frontend/