name: API Contract Tests

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Target API base URL (leave blank to run against isolated PR backend)'
        required: false
        default: ''
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hrms
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms_local_dev_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api-tests/package.json

      - name: Install API test dependencies
        working-directory: api-tests
        run: npm install

      # Option B: Run local PR backend if no external URL provided
      - name: Start Backend for Contract Validation
        if: ${{ github.event.inputs.api_base_url == '' && secrets.API_BASE_URL == '' }}
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          HRMS_DB_URL: jdbc:postgresql://localhost:5432/hrms
          HRMS_DB_USER: hrms
          HRMS_DB_PASSWORD: hrms_local_dev_change_me
          HRMS_STORAGE_ENABLED: "false"
        run: |
          echo "Starting Spring Boot backend in background..."
          mvn spring-boot:run -Dspring-boot.run.profiles=local > backend.log 2>&1 &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV

          echo "Waiting for backend health check..."
          for i in {1..40}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is UP and ready!"
              break
            fi
            echo "Waiting for backend ($i/40)..."
            sleep 3
          done

          if ! curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
            echo "Backend failed to start. Tail of backend.log:"
            tail -n 100 backend.log
            exit 1
          fi

      - name: Run API Contract Tests
        working-directory: api-tests
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || secrets.API_BASE_URL || 'http://localhost:8080' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: npm test

      - name: Teardown Backend
        if: always() && env.BACKEND_PID != ''
        run: |
          echo "Stopping background backend process..."
          kill $BACKEND_PID || true
