# Test profile.
#
# JDBC URL is overridden at runtime by AbstractIntegrationTest via
# @DynamicPropertySource pointing at a Testcontainers PostgreSQL 18 container.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    com.acme.hrms: DEBUG
    org.springframework.security: INFO

hrms:
  cors:
    allowed-origins: http://localhost:5173
  security:
    jwt:
      secret-key: dev-secret-key-must-be-at-least-256-bits-long-32-bytes-to-be-secure
      expiration-ms: 3600000
